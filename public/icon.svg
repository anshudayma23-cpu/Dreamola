<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181445" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#630ed4" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Badge -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#7c3aed" stroke-width="4" stroke-opacity="0.3" />

  <!-- Crescent Moon -->
  <path d="M 275 110 C 175 110 95 190 95 290 C 95 390 175 415 275 415 C 220 380 185 320 185 255 C 185 190 220 135 275 110 Z" fill="url(#moonGrad)" filter="url(#glow)" />
  
  <!-- Sparkle Star 1 (Main) -->
  <path d="M 340 160 Q 340 210 390 210 Q 340 210 340 260 Q 340 210 290 210 Q 340 210 340 160 Z" fill="url(#starGrad)" filter="url(#glow)" />
  
  <!-- Sparkle Star 2 (Secondary) -->
  <path d="M 230 330 Q 230 355 255 355 Q 230 355 230 380 Q 230 355 205 355 Q 230 355 230 330 Z" fill="url(#starGrad)" />

  <!-- Tiny Magic Dot -->
  <circle cx="370" cy="310" r="10" fill="#fef08a" />
</svg>
